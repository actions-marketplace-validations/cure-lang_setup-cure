name: Test setup-cure Action

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang & Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '27'

      - name: Set up Cure (latest)
        uses: ./
        with:
          cure-version: 'latest'

      - name: Test cure executable
        run: |
          cure version
          echo "CURE_HOME is $CURE_HOME"
          echo "CURE_LIB is $CURE_LIB"
